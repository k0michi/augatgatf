name: Cross-Platform Build

on:
  push:
    branches: [ main, develop/* ]
  pull_request:
    branches: [ main, develop/* ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            id: ubuntu-x86_64-gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            id: ubuntu-x86_64-clang
            cc: clang
            cxx: clang++
            cxx_flags: -stdlib=libc++
          - os: macos-latest
            id: macos-arm64-appleclang
            cc: clang
            cxx: clang++
            osx_arch: arm64
          - os: windows-latest
            id: windows-x86_64-msvc
            compiler: msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install glslangValidator (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install glslang

      - name: Install glslangValidator (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y glslang-tools

      - name: Install glslangValidator (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          winget install --id=KhronosGroup.VulkanSDK -e --accept-source-agreements --accept-package-agreements
          $sdkRoot = Get-ChildItem 'C:\VulkanSDK' | Sort-Object Name -Descending | Select-Object -First 1
          echo "VulkanSDK path: $($sdkRoot.FullName)"
          echo "$($sdkRoot.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Set up CMake
        uses: lukka/get-cmake@v3.27.0

      - name: Set up dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        # https://github.com/libsdl-org/SDL/blob/main/docs/README-linux.md
        # gcovr for code coverage
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
          gcovr
    
      - name: Install clang (Ubuntu)
        if: matrix.id == 'ubuntu-x86_64-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev lld llvm

      - name: Configure CMake (Ninja)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Debug -DCODE_COVERAGE=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            ${{ matrix.os == 'macos-latest' && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.osx_arch) || '' }}
          
      - name: Configure CMake (Visual Studio)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 .. -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cd build
          cmake --build . --config Debug --parallel

      - name: Run Tests (ctest)
        run: |
          cd build/internal/keel
          LLVM_PROFILE_FILE="coverage-%p-%m.profraw" ctest -C Debug -V --timeout 60

      - name: Generate coverage report (Ubuntu / Clang)
        if: matrix.id == 'ubuntu-x86_64-clang'
        run: |
          cd build
          llvm-profdata merge -sparse coverage-*.profraw -o coverage.profdata
          TEST_BINS=$(ctest --show-only=json-v1 | node -e 'const p=require("path");let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const j=JSON.parse(s);const bins=new Set;for(const t of j.tests||[]){const cmd=t.command||[];if(!cmd.length)continue;let exe=cmd[0];if(!exe.startsWith("/")&&!/^[A-Za-z]:[\\/]/.test(exe))exe=p.resolve(exe);bins.add(exe);}console.log([...bins].join("\n"));});'
          llvm-cov export -instr-profile=coverage.profdata -format=lcov $TEST_BINS > coverage.lcov

      - name: Upload coverage to Codecov
        if: matrix.id == 'ubuntu-x86_64-clang'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.lcov
          disable_search: true