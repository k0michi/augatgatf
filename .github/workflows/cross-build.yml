name: Cross-Platform Build

on:
  push:
    branches: [ main, develop/* ]
  pull_request:
    branches: [ main, develop/* ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu
            os: ubuntu-latest
            shell: bash
            cache-key: apt
            cache-path: |
              /var/cache/apt/archives
              /var/lib/apt/lists
            install-cmd: sudo apt-get update && sudo apt-get install -y
            packages: >-
              glslang-tools build-essential git make pkg-config cmake ninja-build 
              gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev 
              libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev 
              libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev 
              libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev 
              libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev 
              libudev-dev gcovr

          - id: emscripten
            os: ubuntu-latest
            shell: bash
            cache-key: apt-emscripten
            cache-path: |
              /var/cache/apt/archives
              /var/lib/apt/lists
            install-cmd: sudo apt-get update && sudo apt-get install -y
            packages: build-essential cmake ninja-build

          - id: macos
            os: macos-latest
            shell: bash
            cache-key: brew
            cache-path: ~/Library/Caches/Homebrew
            install-cmd: brew install
            packages: glslang ninja

          - id: windows
            os: windows-latest
            shell: pwsh
            cache-key: winget
            cache-path: ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/diag
            install-cmd: winget install -e --accept-source-agreements --accept-package-agreements --id
            packages: KhronosGroup.VulkanSDK
            post-install: |
              $sdkRoot = Get-ChildItem 'C:\VulkanSDK' | Sort-Object Name -Descending | Select-Object -First 1
              echo "$($sdkRoot.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-path }}
          key: ${{ runner.os }}-${{ matrix.cache-key }}-${{ hashFiles('.github/workflows/cross-build.yml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.cache-key }}-

      - name: Install dependencies
        shell: ${{ matrix.shell }}
        run: ${{ matrix.install-cmd }} ${{ matrix.packages }}

      - name: Post Install (Environment Setup)
        shell: ${{ matrix.shell }}
        if: matrix.post-install != ''
        run: ${{ matrix.post-install }}

      - name: Set up Emscripten
        if: matrix.id == 'emscripten'
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 4.0.15

      - name: Set up CMake
        uses: lukka/get-cmake@v3.27.0

      - name: Enable MSVC dev cmd
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: ${{ matrix.shell }}
        run: |
          ${{ matrix.id == 'emscripten' && 'emcmake' || '' }} \
          cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCODE_COVERAGE=${{ matrix.id == 'ubuntu' && 'ON' || 'OFF' }}

      - name: Build
        shell: ${{ matrix.shell }}
        run: cmake --build build --config Debug --parallel

      - name: Run Tests (ctest)
        shell: ${{ matrix.shell }}
        if: matrix.id != 'emscripten'
        run: |
          cd build/internal/keel
          ctest -C Debug -V --timeout 60

      - name: Generate and Upload coverage
        shell: ${{ matrix.shell }}
        if: matrix.id == 'ubuntu'
        run: |
          cd build
          gcovr -r .. --xml -o coverage.xml
      
      - name: Upload coverage to Codecov
        if: matrix.id == 'ubuntu'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage.xml
          disable_search: true